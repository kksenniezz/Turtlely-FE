<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="turtlely">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>


  <title>turtlely</title>
  <link rel="manifest" href="manifest.json">

  <meta name="google-signin-client_id" content="313213943885-9fko3i9flu4p9s2fodn24aigojd67nkt.apps.googleusercontent.com">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
    <script>
    let poseEngine;
    let htmlVideoElement;

    // 플러터에서 웹 카메라가 켜지면 호출할 초기화 함수
    window.startWebMediaPipe = function() {
      htmlVideoElement = document.querySelector('video');
      if (!htmlVideoElement) return;

      poseEngine = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      poseEngine.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      // 미디어파이프가 좌표를 찾으면 플러터 글로벌 함수로 던짐
      poseEngine.onResults((results) => {
        if (results.poseLandmarks) {
          const landmarks = results.poseLandmarks;
          // 11: 왼어깨(C7대용), 11: 왼눈, 11: 왼귀 대신 미디어파이프 인덱스 매핑 (왼쪽 측면 기준)
          const leftEye = landmarks[11]; 
          const leftEar = landmarks[7];
          const leftShoulder = landmarks[11];

          if (window.onWebPoseDetected) {
            window.onWebPoseDetected(JSON.stringify({
              eyeX: leftEye.x, eyeY: leftEye.y,
              earX: leftEar.x, earY: leftEar.y,
              c7X: leftShoulder.x, c7Y: leftShoulder.y
            }));
          }
        }
      });

      // 브라우저 프레임 단위로 미디어파이프에 비디오 밀어넣기
      async function detectionFrame() {
        if (htmlVideoElement && !htmlVideoElement.paused) {
          await poseEngine.send({ image: htmlVideoElement });
        }
        requestAnimationFrame(detectionFrame);
      }
      htmlVideoElement.addEventListener('play', () => {
        detectionFrame();
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
