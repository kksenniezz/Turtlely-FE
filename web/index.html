<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="turtlely">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>


  <title>turtlely</title>
  <link rel="manifest" href="manifest.json">

  <meta name="google-signin-client_id" content="313213943885-9fko3i9flu4p9s2fodn24aigojd67nkt.apps.googleusercontent.com">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
  let poseEngine;
  let htmlVideoElement;

  // 플러터에서 웹 카메라가 완전히 켜지면 호출할 초기화 함수
  window.startWebMediaPipe = function() {
    console.log("🌐 [JS] startWebMediaPipe 함수가 플러터에 의해 호출되었습니다.");

    htmlVideoElement = document.querySelector('video');
    if (!htmlVideoElement) {
      console.error("🚨 [JS] 비디오 엘리먼트를 찾지 못해 300ms 후 재시도합니다.");
      setTimeout(window.startWebMediaPipe, 300);
      return;
    }

    // 1. 미디어파이프 포즈 엔진 생성
    poseEngine = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    poseEngine.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // 2. 🎯 AI 좌표 감지 콜백 (세은님 앱/웹 통합 우측 관절 규칙 반영)
    poseEngine.onResults((results) => {
      if (results.poseLandmarks) {
        const landmarks = results.poseLandmarks;
        
        // 💡 미디어파이프 표준 우측 인덱스: Right Eye = 5, Right Ear = 8, Right Shoulder = 12
        const rightEye = landmarks[5]; 
        const rightEar = landmarks[8];
        const rightShoulder = landmarks[12]; // C7 대용

        if (rightEye && rightEar && rightShoulder && window.onWebPoseDetected) {
          // 플러터가 기다리는 Key 이름(eyeX, earX, c7X) 그대로 토스!
          window.onWebPoseDetected(JSON.stringify({
            eyeX: rightEye.x, 
            eyeY: rightEye.y,
            earX: rightEar.x, 
            earY: rightEar.y,
            c7X: rightShoulder.x, 
            c7Y: rightShoulder.y
          }));
        }
      }
    });

    // 3. 🔄 이벤트 리스너에만 의존하지 않고, 비디오가 이미 켜져있다면 강제로 루프 구동
    async function detectionFrame() {
      if (htmlVideoElement && !htmlVideoElement.paused && !htmlVideoElement.ended) {
        await poseEngine.send({ image: htmlVideoElement });
      }
      requestAnimationFrame(detectionFrame);
    }

    // 카메라가 이미 재생 중이거나 play 이벤트가 트리거될 때 둘 다 대응하도록 방어
    if (htmlVideoElement.readyState >= 2 && !htmlVideoElement.paused) {
      console.log("🌐 [JS] 비디오가 이미 재생 중이므로 루프를 즉시 시작합니다.");
      detectionFrame();
    } else {
      htmlVideoElement.addEventListener('play', () => {
        console.log("🌐 [JS] 비디오 play 이벤트 감지 -> 루프 시작");
        detectionFrame();
      });
    }
  };
</script>
</body>
</html>
