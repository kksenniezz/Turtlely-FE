name: turtly
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  vibration: ^2.0.0
  path_provider: ^2.1.5
  share_plus: ^7.2.1
  cached_network_image: ^3.3.1

  google_sign_in: ^6.2.1
  flutter_secure_storage: ^10.2.0
  camera: ^0.10.5+9
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  google_mlkit_pose_detection: ^0.12.0

  cupertino_icons: ^1.0.8
  table_calendar: ^3.2.0
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.0
  http: ^1.1.0

  flutter_blue_plus: ^2.3.2

  permission_handler: ^12.0.3
  sensors_plus: ^7.0.0
  fl_chart: ^1.2.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1 # 앱 아이콘 생성 패키지

# ★ 앱 아이콘 자동 생성 설정 ★
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/side_turtle.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/